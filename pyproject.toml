[project]
name = "garmin-datastore"
version = "0.0.1"
description = "Sync all Garmin Connect data into Supabase, with a Claude MCP connector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "garminconnect==0.3.19",
    "curl_cffi>=0.7",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "mcp>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.vercel]
entrypoint = "gds.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
