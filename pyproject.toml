[project]
name = "garmin-datastore"
version = "0.0.1"
description = "Sync all Garmin Connect data into Supabase, with a Claude MCP connector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "garminconnect==0.3.19",
    "curl_cffi>=0.7",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "mcp>=1.10",
    "tzdata>=2024.1",
    "fitdecode>=0.10",
    "python-multipart>=0.0.9",
    "anyio>=4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.vercel]
entrypoint = "gds.app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# BLE: blind `except Exception` must be deliberate (marked noqa: BLE001 with a reason).
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
